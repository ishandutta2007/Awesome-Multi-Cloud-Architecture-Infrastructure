<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .orbit-1 {
        animation: spin 20s linear infinite;
        transform-origin: 980px 180px;
      }
      .orbit-2 {
        animation: spin-rev 26s linear infinite;
        transform-origin: 980px 180px;
      }
      .node-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.96); }
        100% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" />
  </g>

  <!-- Dynamic Animated Graphic on the Right Side -->
  <g id="cloud-network-animation" transform="translate(0, 0)">
    <!-- Ambient glow behind orbit -->
    <circle cx="980" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle" />

    <!-- Outer Orbit Ring -->
    <circle cx="980" cy="180" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
    
    <!-- Inner Orbit Ring -->
    <circle cx="980" cy="180" r="85" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5" />

    <!-- Connecting network lines -->
    <g opacity="0.35" stroke="#94a3b8" stroke-width="1.5">
      <line x1="980" y1="180" x2="890" y2="100" />
      <line x1="980" y1="180" x2="1070" y2="100" />
      <line x1="980" y1="180" x2="1090" y2="240" />
      <line x1="980" y1="180" x2="880" y2="250" />
      <line x1="980" y1="180" x2="980" y2="70" />
    </g>

    <!-- Revolving Ring 1 with nodes -->
    <g class="orbit-1">
      <circle cx="980" cy="50" r="7" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="1110" cy="180" r="6" fill="#818cf8" />
      <circle cx="850" cy="180" r="5" fill="#34d399" />
    </g>

    <!-- Revolving Ring 2 with nodes -->
    <g class="orbit-2">
      <circle cx="980" cy="95" r="5" fill="#f472b6" />
      <circle cx="1065" cy="180" r="6" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="980" cy="265" r="5" fill="#fbbf24" />
      <circle cx="895" cy="180" r="6" fill="#a78bfa" />
    </g>

    <!-- Central Control Plane Hub -->
    <circle cx="980" cy="180" r="38" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Core Icon: Central Cloud / Server Node -->
    <g transform="translate(964, 164)" fill="#38bdf8">
      <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
    </g>
  </g>

  <!-- Left Side: Clean, High-Contrast Typography & Pillars -->
  <g id="header-text" transform="translate(70, 0)">
    <!-- Pill tag -->
    <rect x="0" y="48" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="110" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="128" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome Multi-Cloud
    </text>
    <text x="0" y="172" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Architecture &amp; Infrastructure
    </text>

    <!-- Subtitle -->
    <text x="0" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Leading SaaS Platforms, Hybrid Cloud Control Planes &amp; Open-Source Tools
    </text>

    <!-- Metric Badges / Pillars Row -->
    <g transform="translate(0, 245)">
      <!-- Item 1: Cloud Agnostic -->
      <g>
        <rect x="0" y="0" width="145" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#38bdf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cross-Cloud IaC</text>
      </g>
      <!-- Item 2: Kubernetes -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#818cf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Multi-Cluster K8s</text>
      </g>
      <!-- Item 3: GitOps & Mesh -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#c084fc" />
        <text x="32" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">GitOps &amp; Security</text>
      </g>
    </g>
  </g>
</svg>
